<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>모두의 출석부</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
    :root{font-family:"DM Sans","Noto Sans KR",sans-serif;color:#21312b;background:#f5f7f5;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #82caae;outline-offset:2px}
    .app{min-height:100vh;display:flex}.sidebar{width:242px;background:#fff;border-right:1px solid #e8ede9;display:flex;flex-direction:column;padding:32px 20px;flex-shrink:0}
    .brand{display:flex;align-items:center;gap:11px;padding:0 6px;font-size:17px;font-weight:800;letter-spacing:-.7px}.brand-icon{width:36px;height:36px;border-radius:11px;background:#247b5d;color:white;display:grid;place-items:center}.brand-icon svg{width:21px}
    .side-label{color:#a7b3ac;font-size:10px;font-weight:700;letter-spacing:1.3px;margin:53px 12px 14px}.nav-item{display:flex;align-items:center;gap:12px;background:#eaf5ee;color:#267b5e;border-radius:9px;padding:13px 12px;font-size:13px;font-weight:700}.nav-item svg{width:19px;height:19px}.sidebar-bottom{margin-top:auto;border-top:1px solid #eef1ef;padding:21px 5px 0;display:flex;gap:10px;align-items:center}.teacher-avatar{height:36px;width:36px;display:grid;place-items:center;border-radius:50%;background:#dfede4;color:#347e60;font-size:13px;font-weight:800}.teacher-info strong,.teacher-info span{display:block}.teacher-info strong{font-size:12px}.teacher-info span{font-size:11px;color:#99a59e;margin-top:3px}
    main{flex:1;min-width:0;padding:35px 52px 50px}.container{max-width:1180px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:49px}.breadcrumb{font-size:12px;color:#a1ada6}.breadcrumb strong{color:#67786e;font-weight:600}.top-right{display:flex;align-items:center;gap:12px;font-size:12px;color:#75857b}.top-avatar{width:34px;height:34px;border-radius:50%;background:#e2eee6;display:grid;place-items:center;color:#408366;font-weight:700}
    .heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:27px}.eyebrow{display:flex;align-items:center;gap:7px;color:#368666;font-weight:700;font-size:11px;letter-spacing:.8px;margin-bottom:10px}.eyebrow:before{content:"";width:6px;height:6px;background:#57a980;border-radius:50%}h1{font-size:30px;letter-spacing:-1.6px;line-height:1.2;margin:0;font-weight:800}.subtitle{font-size:13px;color:#8a9990;margin:10px 0 0}.date-control{display:flex;align-items:center;gap:3px;background:white;border:1px solid #e3ebe5;border-radius:10px;padding:5px;box-shadow:0 2px 6px #263e2b08}.icon-button{width:32px;height:32px;border:0;background:transparent;color:#7f9186;border-radius:7px;display:grid;place-items:center}.icon-button:hover{background:#f1f6f2;color:#267b5e}.icon-button svg{width:16px;height:16px}.date-control input{width:138px;border:0;color:#3e5146;font-size:12px;font-weight:700;background:transparent;padding:4px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}.stat{background:#fff;border:1px solid #e9efea;border-radius:14px;padding:20px 21px;min-height:118px;box-shadow:0 4px 15px #1d442908}.stat-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:#84938a}.stat-icon{height:31px;width:31px;border-radius:9px;display:grid;place-items:center}.stat-icon svg{width:16px;height:16px}.stat strong{display:inline-block;font-size:28px;line-height:1;margin-top:17px;letter-spacing:-1px}.stat small{font-size:12px;color:#a0ada4;margin-left:4px}.green{background:#e9f6ed;color:#3c9b68}.blue{background:#edf4fd;color:#6c96ce}.orange{background:#fff4e7;color:#e5a450}.gray{background:#f1f3f1;color:#9daaa1}
    .card{background:#fff;border:1px solid #e7eee8;border-radius:16px;box-shadow:0 5px 20px #1d442908;overflow:hidden}.card-header{padding:24px 25px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}.card-title{display:flex;align-items:center;gap:10px}.card-title h2{font-size:17px;letter-spacing:-.6px;margin:0}.count-pill{background:#eef6f0;color:#4b9270;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:700}.card-description{font-size:12px;color:#9aa89e;margin:7px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #e4ebe5;background:#fff;color:#5d7064;border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.btn:hover{background:#f7faf8}.btn svg{width:15px;height:15px}.btn-primary{background:#287d5f;color:white;border-color:#287d5f}.btn-primary:hover{background:#206a50}
    .toolbar{padding:0 25px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.search{position:relative;width:250px;max-width:100%}.search svg{position:absolute;left:12px;top:11px;width:16px;color:#a6b3aa}.search input{width:100%;height:38px;border:1px solid #e9eeea;border-radius:8px;background:#fafcfb;padding:0 12px 0 37px;font-size:12px;color:#334a3d}.search input::placeholder{color:#b0bcb3}.hint{font-size:11px;color:#a3afa7;display:flex;align-items:center;gap:6px}.hint i{width:6px;height:6px;background:#86bd99;border-radius:50%}
    .table-head,.student-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(270px,1.3fr) 44px;align-items:center}.table-head{background:#f9fbf9;border-top:1px solid #edf2ee;border-bottom:1px solid #edf2ee;padding:12px 25px;color:#9ca9a0;font-size:10px;font-weight:700;letter-spacing:.3px}.student-row{padding:14px 25px;border-bottom:1px solid #f0f3f0;min-height:71px}.student-row:last-child{border-bottom:0}.student{display:flex;align-items:center;gap:12px;min-width:0}.student-avatar{width:37px;height:37px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800}.student-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.student-number{font-size:10px;color:#a6b2aa;margin-top:4px}.statuses{display:flex;gap:6px;flex-wrap:wrap}.status{border:1px solid #edf1ed;background:#fff;color:#a0ada4;border-radius:7px;padding:7px 11px;font-size:11px;font-weight:700;min-width:49px}.status:hover{border-color:#b9d8c3;color:#4b8e69}.status.active.present{background:#e8f6ec;color:#328d5a;border-color:#d4eddb}.status.active.late{background:#edf4fe;color:#648fc5;border-color:#dceafd}.status.active.absent{background:#fff1e2;color:#d6933f;border-color:#fce5cc}.status.active.excused{background:#f0f2f0;color:#77877d;border-color:#e4e9e5}.remove{justify-self:end;color:#c0cbc3}.empty{text-align:center;padding:56px 20px;color:#98a69c;font-size:13px}.card-footer{padding:16px 25px;background:#fcfdfc;border-top:1px solid #f0f3f0;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#a3afa6;font-size:11px}.footer-note{display:flex;align-items:center;gap:6px}.footer-note svg{width:14px;height:14px;color:#8cb99c}.text-button{border:0;background:none;color:#9caaa0;font-size:11px;padding:4px}.text-button:hover{color:#ca785d}
    .page-footer{display:flex;justify-content:space-between;margin-top:24px;font-size:11px;color:#b1bdb5}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#263e31;color:white;padding:11px 17px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    dialog{border:0;border-radius:16px;padding:0;box-shadow:0 20px 60px #19372930;width:min(400px,calc(100% - 32px));color:#21312b}dialog::backdrop{background:#1b3025aa}.dialog-content{padding:27px}.dialog-content h2{font-size:19px;margin:0 0 8px}.dialog-content p{font-size:12px;color:#90a096;margin:0 0 22px}.dialog-content label{font-size:12px;font-weight:700;display:block;margin-bottom:8px}.dialog-content input{width:100%;border:1px solid #dfe9e1;border-radius:8px;padding:11px;font-size:13px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .stats{grid-template-columns:repeat(5,1fr)}.status.active.early{background:#f5eefb;color:#9b72bd;border-color:#e9ddf4}.status-options{display:flex;gap:6px;flex-wrap:wrap}.periods{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px}.period-label{font-size:10px;color:#95a39a;margin-right:3px}.period{border:1px solid #e8eee9;background:#fff;color:#8b9b90;border-radius:6px;padding:5px 7px;font-size:10px}.period.active{background:#e8f6ec;border-color:#b9dfc5;color:#328d5a;font-weight:700}
    @media(max-width:900px){.sidebar{width:76px;padding:28px 14px}.brand{justify-content:center;padding:0}.brand-text,.side-label,.nav-item span,.teacher-info{display:none}.nav-item{justify-content:center;margin-top:47px;padding:13px}.sidebar-bottom{justify-content:center}.topbar{margin-bottom:38px}main{padding:30px}.stats{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:620px){.sidebar{display:none}main{padding:23px 16px 35px}.topbar{margin-bottom:32px}.top-right span{display:none}.heading{align-items:flex-start;flex-direction:column;gap:19px}h1{font-size:26px}.date-control{align-self:stretch;justify-content:space-between}.date-control input{text-align:center}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;min-height:105px}.stat strong{font-size:25px;margin-top:12px}.card-header{align-items:flex-start;flex-direction:column;padding:21px 17px 17px}.actions{width:100%}.actions .btn{flex:1}.toolbar{padding:0 17px 16px}.search{width:100%}.hint{display:none}.table-head{display:none}.student-row{grid-template-columns:1fr 36px;gap:12px;padding:15px 17px}.statuses{grid-column:1 / -1;grid-row:2;display:block}.status-options{display:grid;grid-template-columns:repeat(5,1fr)}.status{min-width:0;padding:9px 4px}.remove{grid-column:2;grid-row:1}.card-footer{padding:15px 17px}.page-footer{line-height:1.6}.page-footer span:last-child{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16m-11 5 2 2 4-4"/></svg></div><span class="brand-text">모두의 출석부</span></div>
      <div class="side-label">WORKSPACE</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M7 2v4m10-4v4M3 9h18m-12 6 2 2 4-4"/></svg><span>출석 관리</span></div>
      <div class="sidebar-bottom"><div class="teacher-avatar">선</div><div class="teacher-info"><strong>선생님</strong><span>우리 반 관리자</span></div></div>
    </aside>
    <main>
      <div class="container">
        <div class="topbar"><div class="breadcrumb">우리 반 <span aria-hidden="true">&nbsp; / &nbsp;</span> <strong>출석 관리</strong></div><div class="top-right"><span>반가워요, 선생님</span><div class="top-avatar">선</div></div></div>
        <section class="heading">
          <div><div class="eyebrow">ATTENDANCE</div><h1>오늘의 출석부</h1><p class="subtitle">아이들의 하루를 출석 체크로 시작해 보세요.</p></div>
          <div class="date-control"><button class="icon-button" id="prevDate" aria-label="이전 날짜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><input id="date" type="date" aria-label="출석 날짜"><button class="icon-button" id="nextDate" aria-label="다음 날짜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button></div>
        </section>
        <section class="stats" aria-label="출석 현황">
          <div class="stat"><div class="stat-top"><span>전체 학생</span><div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 19v-1a6 6 0 0 1 12 0v1M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5"/></svg></div></div><strong id="total">0</strong><small>명</small></div>
          <div class="stat"><div class="stat-top"><span>출석</span><div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div></div><strong id="presentCount">0</strong><small>명</small></div>
          <div class="stat"><div class="stat-top"><span>지각</span><div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></div></div><strong id="lateCount">0</strong><small>명</small></div>
          <div class="stat"><div class="stat-top"><span>조퇴</span><div class="stat-icon" style="background:#f5eefb;color:#9b72bd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H5v14h5m4-11 4 4-4 4m4-4H9"/></svg></div></div><strong id="earlyCount">0</strong><small>명</small></div>
          <div class="stat"><div class="stat-top"><span>결석</span><div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="m9 9 6 6m0-6-6 6"/></svg></div></div><strong id="absentCount">0</strong><small>명</small></div>
        </section>
        <section class="card">
          <div class="card-header"><div><div class="card-title"><h2>학생 출석 현황</h2><span class="count-pill" id="studentCount">0명</span></div><p class="card-description">학생별 출석 상태를 선택해 주세요.</p></div><div class="actions"><button class="btn" id="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M5 17v3h14v-3"/></svg> 내보내기</button><button class="btn btn-primary" id="addStudent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> 학생 추가</button></div></div>
          <div class="toolbar"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="학생 번호 검색" aria-label="학생 번호 검색"></div><div class="hint"><i></i> 변경 사항이 자동으로 저장됩니다</div></div>
          <div class="table-head"><span>학생</span><span>출석 상태</span><span></span></div>
          <div id="studentList"></div>
          <div class="card-footer"><div class="footer-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span id="progress">확인 전 0명</span></div><div><button class="text-button" id="markAll">모두 출석</button><button class="text-button" id="resetDay">선택 날짜 초기화</button></div></div>
        </section>
        <div class="page-footer"><span>작은 관심이 모여, 더 따뜻한 교실이 됩니다.</span><span>모두의 출석부 &nbsp;·&nbsp; 우리 반의 하루</span></div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const key = 'modu-attendance-v1';
      const statuses = {present:'출석', late:'지각', early:'조퇴', absent:'결석', excused:'인정'};
      const colors = [['#e9f3eb','#6b9b75'],['#eef0fa','#8790b7'],['#fff2e8','#c89772'],['#edf5f5','#78a5a1'],['#f5eef4','#ae86a2']];
      const $ = id => document.getElementById(id);
      const localDate = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      const makeId = () => globalThis.crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      let data;
      let isNew = false;
      try {
        const saved = localStorage.getItem(key);
        isNew = saved === null;
        data = saved ? JSON.parse(saved) : {students: Array.from({length:10}, () => ({id:makeId()})), records:{}};
        if (!Array.isArray(data.students) || !data.records || typeof data.records !== 'object') throw new Error('Invalid data');
      } catch (error) {
        data = {students:[], records:{}};
        alert('저장된 출석부를 불러오지 못했습니다. 브라우저 저장 공간을 확인해 주세요.');
      }
      let toastTimer;
      function notify(message) {
        $('toast').textContent = message;
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2600);
      }
      function save() {
        try { localStorage.setItem(key, JSON.stringify(data)); return true; }
        catch (error) { notify('저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.'); return false; }
      }
      function recordFor(records, id) {
        const record = records[id];
        return typeof record === 'string' ? {status:record} : (record || {});
      }
      $('date').value = localDate(new Date());
      function render() {
        const date = $('date').value;
        const records = data.records[date] || {};
        const students = data.students;
        $('total').textContent = students.length;
        $('studentCount').textContent = `${students.length}명`;
        for (const status of ['present','late','early','absent']) $(`${status}Count`).textContent = students.filter(student => recordFor(records, student.id).status === status).length;
        const remaining = students.filter(student => !statuses[recordFor(records, student.id).status]).length;
        $('progress').textContent = `확인 전 ${remaining}명 · 인정 ${students.filter(student => recordFor(records, student.id).status === 'excused').length}명`;
        const list = $('studentList');
        list.replaceChildren();
        const query = $('search').value.trim().toLocaleLowerCase();
        const filtered = students.map((student,index) => ({student,index})).filter(({index}) => `${index + 1}번`.includes(query));
        if (!filtered.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = students.length ? '검색 결과가 없습니다.' : '학생을 추가해 출석부를 시작해 보세요.';
          list.append(empty);
          return;
        }
        filtered.forEach(({student,index}) => {
          const number = index + 1;
          const record = recordFor(records, student.id);
          const row = document.createElement('div'); row.className = 'student-row';
          const person = document.createElement('div'); person.className = 'student';
          const avatar = document.createElement('div'); avatar.className = 'student-avatar'; avatar.textContent = number; avatar.style.background = colors[index % colors.length][0]; avatar.style.color = colors[index % colors.length][1];
          const details = document.createElement('div');
          const name = document.createElement('div'); name.className = 'student-name'; name.textContent = `${number}번 학생`;
          details.append(name); person.append(avatar,details);
          const options = document.createElement('div'); options.className = 'statuses';
          const statusOptions = document.createElement('div'); statusOptions.className = 'status-options'; statusOptions.setAttribute('role','group'); statusOptions.setAttribute('aria-label',`${number}번 학생 출석 상태`);
          Object.entries(statuses).forEach(([status,label]) => {
            const button = document.createElement('button'); button.className = `status ${status}${record.status === status ? ' active' : ''}`; button.textContent = label;
            button.setAttribute('aria-pressed', String(record.status === status));
            button.addEventListener('click', () => {
              if (!data.records[date]) data.records[date] = {};
              if (record.status === status) delete data.records[date][student.id];
              else data.records[date][student.id] = {status};
              save(); render();
            });
            statusOptions.append(button);
          });
          options.append(statusOptions);
          if (record.status === 'late' || record.status === 'early') {
            const periods = document.createElement('div'); periods.className = 'periods'; periods.setAttribute('role','group'); periods.setAttribute('aria-label',`${number}번 학생 ${statuses[record.status]} 교시`);
            const label = document.createElement('span'); label.className = 'period-label'; label.textContent = '교시 선택'; periods.append(label);
            for (let period = 1; period <= 6; period++) {
              const button = document.createElement('button'); button.className = `period${record.period === period ? ' active' : ''}`; button.textContent = `${period}교시`;
              button.setAttribute('aria-pressed', String(record.period === period));
              button.addEventListener('click', () => {
                data.records[date][student.id] = {status:record.status, ...(record.period === period ? {} : {period})};
                save(); render();
              });
              periods.append(button);
            }
            options.append(periods);
          }
          const remove = document.createElement('button'); remove.className = 'icon-button remove'; remove.setAttribute('aria-label',`${number}번 학생 삭제`); remove.title = '학생 삭제';
          remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
          remove.addEventListener('click', () => {
            if (!confirm(`${number}번 학생을 삭제할까요? 모든 날짜의 해당 학생 기록이 삭제되고 뒤 학생들의 번호가 당겨집니다.`)) return;
            data.students = data.students.filter(item => item.id !== student.id);
            Object.values(data.records).forEach(day => delete day[student.id]);
            if (save()) notify('학생이 삭제되었습니다.');
            render();
          });
          row.append(person,options,remove); list.append(row);
        });
      }
      $('date').addEventListener('change', () => { if (!$('date').value) $('date').value = localDate(new Date()); render(); });
      function moveDate(days) { const date = new Date(`${$('date').value}T12:00:00`); date.setDate(date.getDate() + days); $('date').value = localDate(date); render(); }
      $('prevDate').addEventListener('click', () => moveDate(-1));
      $('nextDate').addEventListener('click', () => moveDate(1));
      $('search').addEventListener('input', render);
      $('addStudent').addEventListener('click', () => {
        data.students.push({id:makeId()});
        $('search').value = '';
        if (save()) notify('학생이 추가되었습니다.');
        render();
      });
      $('markAll').addEventListener('click', () => {
        if (!data.students.length) { notify('먼저 학생을 추가해 주세요.'); return; }
        if (data.students.some(student => (data.records[$('date').value] || {})[student.id]) && !confirm('선택한 날짜의 모든 학생을 출석으로 변경할까요?')) return;
        data.records[$('date').value] = Object.fromEntries(data.students.map(student => [student.id,{status:'present'}]));
        if (save()) notify('모든 학생을 출석 처리했습니다.');
        render();
      });
      $('resetDay').addEventListener('click', () => {
        if (!Object.keys(data.records[$('date').value] || {}).length) { notify('초기화할 출석 기록이 없습니다.'); return; }
        if (!confirm('선택한 날짜의 출석 기록을 모두 초기화할까요?')) return;
        delete data.records[$('date').value];
        if (save()) notify('선택한 날짜의 출석 기록을 초기화했습니다.');
        render();
      });
      $('export').addEventListener('click', () => {
        const date = $('date').value;
        const records = data.records[date] || {};
        const cell = value => `"${String(value).replace(/^[=+\-@\t\r]/, "'$&").replace(/"/g,'""')}"`;
        const rows = [['날짜','번호','출석 상태','교시'], ...data.students.map((student,index) => { const record = recordFor(records, student.id); return [date,index+1,statuses[record.status] || '확인 전',record.period ? `${record.period}교시` : '']; })];
        const blob = new Blob(['\ufeff' + rows.map(row => row.map(cell).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'});
        const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = `출석부-${date}.csv`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify('선택한 날짜의 출석부를 내보냈습니다.');
      });
      if (isNew) save();
      render();
    })();
  </script>
</body>
</html>
